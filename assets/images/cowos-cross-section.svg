<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 540" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="interposer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="hbm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="substrate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="heatsink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="540" fill="url(#bg)" rx="8"/>

  <!-- 标题 -->
  <text x="375" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">CoWoS 先进封装结构截面图</text>
  <text x="375" y="46" text-anchor="middle" font-size="12" fill="#888">Chip-on-Wafer-on-Substrate · GPU + HBM 通过硅中介层高速互联</text>

  <!-- ===== 主要结构（从下到上） ===== -->

  <!-- 1. PCB 主板 -->
  <rect x="160" y="430" width="380" height="45" fill="#9ca3af" rx="2"/>
  <text x="350" y="455" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">PCB 主板</text>

  <!-- PCB 内走线纹理 -->
  <line x1="180" y1="445" x2="520" y2="445" stroke="#b0b0b0" stroke-width="0.5"/>
  <line x1="180" y1="455" x2="520" y2="455" stroke="#b0b0b0" stroke-width="0.5"/>

  <!-- 2. C4 Solder Bump（焊球阵列） -->
  <g fill="#f59e0b">
    <circle cx="195" cy="422" r="6"/>
    <circle cx="225" cy="422" r="6"/>
    <circle cx="255" cy="422" r="6"/>
    <circle cx="285" cy="422" r="6"/>
    <circle cx="315" cy="422" r="6"/>
    <circle cx="350" cy="422" r="6"/>
    <circle cx="385" cy="422" r="6"/>
    <circle cx="415" cy="422" r="6"/>
    <circle cx="445" cy="422" r="6"/>
    <circle cx="475" cy="422" r="6"/>
    <circle cx="505" cy="422" r="6"/>
  </g>

  <!-- 3. 封装基板 Substrate -->
  <rect x="170" y="375" width="360" height="40" fill="url(#substrate)" rx="2" stroke="#eab308" stroke-width="0.5"/>
  <text x="350" y="398" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">封装基板（Substrate）</text>

  <!-- 基板内布线 -->
  <line x1="190" y1="390" x2="510" y2="390" stroke="#fbbf24" stroke-width="0.8"/>
  <line x1="190" y1="400" x2="510" y2="400" stroke="#fbbf24" stroke-width="0.8"/>

  <!-- 4. μBump（微凸点） -->
  <g fill="#f97316">
    <circle cx="210" cy="370" r="3"/>
    <circle cx="240" cy="370" r="3"/>
    <circle cx="270" cy="370" r="3"/>
    <circle cx="300" cy="370" r="3"/>
    <circle cx="330" cy="370" r="3"/>
    <circle cx="360" cy="370" r="3"/>
    <circle cx="390" cy="370" r="3"/>
    <circle cx="420" cy="370" r="3"/>
    <circle cx="450" cy="370" r="3"/>
    <circle cx="480" cy="370" r="3"/>
  </g>

  <!-- 5. 硅中介层 Silicon Interposer -->
  <rect x="155" y="320" width="390" height="45" fill="url(#interposer)" rx="2" stroke="#93c5fd" stroke-width="1"/>
  <text x="350" y="337" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">硅中介层（Silicon Interposer）</text>
  <text x="350" y="352" text-anchor="middle" font-size="10" fill="#3b82f6">—— 内部 TSV（硅通孔）和金属布线实现 chip-to-chip 互联 ——</text>

  <!-- TSV 硅通孔示意 -->
  <g stroke="#60a5fa" stroke-width="1.5" opacity="0.6">
    <line x1="220" y1="325" x2="220" y2="360"/>
    <line x1="270" y1="325" x2="270" y2="360"/>
    <line x1="320" y1="325" x2="320" y2="360"/>
    <line x1="430" y1="325" x2="430" y2="360"/>
    <line x1="480" y1="325" x2="480" y2="360"/>
  </g>

  <!-- 硅中介层内互联线（GPU→HBM） -->
  <g stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5">
    <line x1="275" y1="340" x2="415" y2="340"/>
    <line x1="275" y1="347" x2="415" y2="347"/>
    <line x1="275" y1="354" x2="415" y2="354"/>
  </g>
  <text x="345" y="305" text-anchor="middle" font-size="9" fill="#ef4444">← 芯片间高速互联（>2 TB/s） →</text>

  <!-- 6. GPU Die + HBM Stacks -->

  <!-- GPU Die -->
  <rect x="170" y="242" width="130" height="73" fill="url(#gpu)" rx="3" stroke="#dc2626" stroke-width="1"/>
  <text x="235" y="278" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">GPU</text>
  <text x="235" y="294" text-anchor="middle" font-size="10" fill="#fee2e2">Die</text>

  <!-- HBM Stack 1 -->
  <rect x="340" y="242" width="48" height="73" fill="url(#hbm)" rx="3" stroke="#2563eb" stroke-width="1"/>
  <text x="364" y="268" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">HBM</text>
  <text x="364" y="282" text-anchor="middle" font-size="8" fill="#dbeafe">DRAM</text>
  <text x="364" y="296" text-anchor="middle" font-size="8" fill="#dbeafe">Stack</text>
  <!-- HBM 堆叠分割线 -->
  <line x1="340" y1="258" x2="388" y2="258" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="340" y1="275" x2="388" y2="275" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="340" y1="292" x2="388" y2="292" stroke="#60a5fa" stroke-width="0.5"/>

  <!-- HBM Stack 2 -->
  <rect x="398" y="242" width="48" height="73" fill="url(#hbm)" rx="3" stroke="#2563eb" stroke-width="1"/>
  <text x="422" y="268" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">HBM</text>
  <text x="422" y="282" text-anchor="middle" font-size="8" fill="#dbeafe">DRAM</text>
  <text x="422" y="296" text-anchor="middle" font-size="8" fill="#dbeafe">Stack</text>
  <line x1="398" y1="258" x2="446" y2="258" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="398" y1="275" x2="446" y2="275" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="398" y1="292" x2="446" y2="292" stroke="#60a5fa" stroke-width="0.5"/>

  <!-- HBM Stack 3 -->
  <rect x="456" y="242" width="48" height="73" fill="url(#hbm)" rx="3" stroke="#2563eb" stroke-width="1"/>
  <text x="480" y="268" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">HBM</text>
  <text x="480" y="282" text-anchor="middle" font-size="8" fill="#dbeafe">DRAM</text>
  <text x="480" y="296" text-anchor="middle" font-size="8" fill="#dbeafe">Stack</text>
  <line x1="456" y1="258" x2="504" y2="258" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="456" y1="275" x2="504" y2="275" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="456" y1="292" x2="504" y2="292" stroke="#60a5fa" stroke-width="0.5"/>

  <!-- 7. TIM（导热界面材料） -->
  <rect x="165" y="234" width="345" height="6" fill="#d4d4d8" rx="1"/>
  <text x="350" y="232" text-anchor="middle" font-size="9" fill="#a1a1aa">TIM 导热胶</text>

  <!-- 8. 散热盖 / Heat Spreader -->
  <rect x="155" y="195" width="365" height="36" fill="url(#heatsink)" rx="3" stroke="#9ca3af" stroke-width="1"/>
  <!-- 散热鳍片纹理 -->
  <g stroke="#b0b0b0" stroke-width="0.5">
    <line x1="170" y1="198" x2="170" y2="228"/>
    <line x1="190" y1="198" x2="190" y2="228"/>
    <line x1="210" y1="198" x2="210" y2="228"/>
    <line x1="230" y1="198" x2="230" y2="228"/>
    <line x1="250" y1="198" x2="250" y2="228"/>
    <line x1="270" y1="198" x2="270" y2="228"/>
    <line x1="290" y1="198" x2="290" y2="228"/>
    <line x1="310" y1="198" x2="310" y2="228"/>
    <line x1="340" y1="198" x2="340" y2="228"/>
    <line x1="370" y1="198" x2="370" y2="228"/>
    <line x1="400" y1="198" x2="400" y2="228"/>
    <line x1="430" y1="198" x2="430" y2="228"/>
    <line x1="460" y1="198" x2="460" y2="228"/>
    <line x1="490" y1="198" x2="490" y2="228"/>
    <line x1="510" y1="198" x2="510" y2="228"/>
  </g>
  <text x="350" y="217" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">散热盖 / Heat Spreader</text>

  <!-- 右侧结构标注 -->
  <g transform="translate(560, 200)" font-size="11" fill="#555">
    <line x1="-15" y1="5" x2="0" y2="5" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="9">散热盖 + TIM</text>

    <line x1="-15" y1="57" x2="0" y2="57" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="61" fill="#dc2626" font-weight="bold">GPU Die / HBM Stack</text>
    <text x="5" y="75" font-size="10" fill="#888">并排放置在硅中介层上</text>

    <line x1="-15" y1="110" x2="0" y2="110" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="114" fill="#1e40af" font-weight="bold">硅中介层</text>
    <text x="5" y="128" font-size="10" fill="#888">内部 TSV + 金属互连</text>
    <text x="5" y="142" font-size="10" fill="#888">带宽可达 2-4 TB/s</text>

    <line x1="-15" y1="175" x2="0" y2="175" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="179" fill="#92400e" font-weight="bold">封装基板</text>

    <line x1="-15" y1="216" x2="0" y2="216" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="220">C4 Bump / μBump</text>

    <line x1="-15" y1="238" x2="0" y2="238" stroke="#aaa" stroke-width="0.5"/>
    <text x="5" y="242">PCB 主板</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(50, 495)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#333">为什么需要 CoWoS？</text>
    <text x="0" y="18" font-size="11" fill="#666">• GPU 训练时需要从 HBM 读取 TB/s 级数据 —— 传统 PCB 走线带宽不够、延迟太高</text>
    <text x="0" y="34" font-size="11" fill="#666">• CoWoS 把 GPU 和 HBM 放在同一块硅中介层上，间距从厘米级缩到微米级</text>
    <text x="0" y="50" font-size="11" fill="#666">• 带宽提升 10-100 倍，功耗反而降低 —— AI 训练和推理的关键使能技术</text>
  </g>
</svg>