site_name: AI 产业链投资分析
site_description: AI 产业链投资分析报告 — 从芯片到应用，全景透视
site_author: AI Agent
site_url: https://QIUZHUOFEI.github.io/AI-Investment/
repo_url: https://github.com/QIUZHUOFEI/AI-Investment
repo_name: AI-Investment

theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

nav:
  - 🏠 首页: index.md
  - 🛠️ 半导体设备:
    - 💡 光刻机入门: 半导体设备/index.md
    - 🇨🇳 中微公司 (688012): 半导体设备/688012.md
    - 🇨🇳 北方华创 (002371): 半导体设备/002371.md
  - 📡 光通信:
    - 领域总览: 光通信/index.md
    - 📡 光模块深度解读: 光通信/光模块/index.md
    - Lumentum (LITE): 光通信/lumentum.md
    - Coherent (COHR): 光通信/coherent.md
    - 中际旭创 (300308): 光通信/中际旭创.md
    - Broadcom (AVGO): 光通信/broadcom.md
  - 🔵 算力芯片:
    - 领域总览: 算力芯片/index.md
    - 🥇 NVIDIA (NVDA): 算力芯片/nvda.md
    - 🥈 AMD (AMD): 算力芯片/amd.md
    - 🔷 Broadcom (AVGO): 算力芯片/avgo.md
    - 🇨🇳 寒武纪 (688256): 算力芯片/688256.md
    - 🇨🇳 海光信息 (688041): 算力芯片/688041.md
  - 💾 存储芯片:
    - 领域总览: 存储芯片/index.md
    - 🇰🇷 三星电子 (SSNLF): 存储芯片/samsung.md
    - 🇰🇷 SK 海力士 (000660.KS): 存储芯片/skhynix.md
    - 🇺🇸 美光科技 (MU): 存储芯片/mu.md
  - 🌡️ 液冷/散热:
    - 领域总览: 液冷/index.md
    - 🌐 维谛技术 (VRT): 液冷/vrt.md
    - 🇨🇳 英维克 (002837): 液冷/002837.md
    - 🇨🇳 高澜股份 (300499): 液冷/300499.md
  - 🖥️ 服务器/整机:
    - 领域总览: 服务器/index.md
    - 🧩 NVL72 深度拆解: 服务器/nvl72.md
  - 🏭 算力基础设施:
    - 领域总览: 算力基础设施/index.md
    - 🏠 数据中心（IDC）: 算力基础设施/idc.md
    - ☁️ 算力租赁（Neocloud）: 算力基础设施/neocloud.md
  - 🔬 先进封装:
    - 领域总览: 先进封装/index.md
    - 🥇 台积电封装（TSM）: 先进封装/tsmc.md
    - 🥈 日月光投控（ASX）: 先进封装/asx.md
    - 🥉 Amkor（AMKR）: 先进封装/amkr.md
    - 🇨🇳 长电科技（600584）: 先进封装/600584.md
    - 🇨🇳 通富微电（002156）: 先进封装/002156.md
  - 🔌 PCB与连接器:
    - 领域总览: PCB/index.md
    - 🌐 欣兴电子 (3037.TW): PCB/unimicron.md
    - 🇨🇳 沪电股份 (002463): PCB/002463.md
    - 🇨🇳 深南电路 (002916): PCB/002916.md
    - 🇨🇳 鹏鼎控股 (002938): PCB/002938.md
  - 📊 全产业链对比:
