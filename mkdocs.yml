site_name: AI 产业链投资分析
site_description: AI 产业链投资分析报告 — 从芯片到应用，全景透视
site_author: AI Agent
site_url: https://QIUZHUOFEI.github.io/AI-Investment/
repo_url: https://github.com/QIUZHUOFEI/AI-Investment
repo_name: AI-Investment

theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

nav:
  - 🏠 首页: index.md
  - 📡 光通信:
    - 领域总览: 光通信/index.md
    - 📡 光模块深度解读: 光通信/光模块/index.md
    - Lumentum (LITE): 光通信/lumentum.md
    - Coherent (COHR): 光通信/coherent.md
    - 中际旭创 (300308): 光通信/中际旭创.md
    - Broadcom (AVGO): 光通信/broadcom.md
  - 🔵 算力芯片:
    - 领域总览: 算力芯片/index.md
  - 💾 存储芯片:
    - 领域总览: 存储芯片/index.md
  - 🌡️ 液冷/散热:
    - 领域总览: 液冷/index.md
  - 🖥️ 服务器/整机:
    - 领域总览: 服务器/index.md
    - 🧩 NVL72 深度拆解: 服务器/nvl72.md
  - 🏭 算力基础设施:
    - 领域总览: 算力基础设施/index.md
    - 🏠 数据中心（IDC）: 算力基础设施/idc.md
    - ☁️ 算力租赁（Neocloud）: 算力基础设施/neocloud.md
  - 🔬 先进封装:
    - 领域总览: 先进封装/index.md
  - 🔌 PCB与连接器:
    - 领域总览: PCB/index.md
  - 📊 全产业链对比:
    - 领域总览: 对比/index.md
