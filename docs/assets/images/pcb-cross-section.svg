<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="700" height="400" fill="#fafafa" rx="8"/>

  <!-- 标题 -->
  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">AI 服务器 PCB 多层板结构截面图</text>
  <text x="350" y="50" text-anchor="middle" font-size="12" fill="#888">多层压合结构 · 普通服务器 8-12 层 vs AI 服务器 20+ 层</text>

  <!-- 图例 -->
  <g transform="translate(460, 70)">
    <rect x="0" y="0" width="14" height="14" ry="2" fill="#2d8a4e" opacity="0.8"/>
    <text x="20" y="12" font-size="11" fill="#555">阻焊层（Solder Mask）</text>
    <rect x="0" y="22" width="14" height="14" ry="2" fill="url(#copper)"/>
    <text x="20" y="34" font-size="11" fill="#555">铜箔走线层（Copper）</text>
    <rect x="0" y="44" width="14" height="14" ry="2" fill="url(#pp)"/>
    <text x="20" y="56" font-size="11" fill="#555">半固化片 PP（绝缘）</text>
    <rect x="0" y="66" width="14" height="14" ry="2" fill="url(#core)"/>
    <text x="20" y="78" font-size="11" fill="#555">芯板 Core</text>
  </g>

  <!-- ===== 层叠结构（左半部分） ===== -->
  
  <!-- 1. 顶层阻焊 -->
  <rect x="70" y="75" width="280" height="8" fill="#2d8a4e" rx="1" opacity="0.7"/>
  <!-- 2. 顶层铜箔 -->
  <rect x="70" y="85" width="280" height="10" fill="url(#copper)" rx="1"/>
  <!-- 3. PP -->
  <rect x="70" y="97" width="280" height="28" fill="url(#pp)" rx="1"/>
  <!-- 4. 内层铜箔1 -->
  <rect x="70" y="127" width="280" height="10" fill="url(#copper)" rx="1"/>
  <!-- 5. 芯板（厚） -->
  <rect x="70" y="139" width="280" height="70" fill="url(#core)" rx="1"/>
  <!-- 6. 内层铜箔2 -->
  <rect x="70" y="211" width="280" height="10" fill="url(#copper)" rx="1"/>
  <!-- 7. PP -->
  <rect x="70" y="223" width="280" height="28" fill="url(#pp)" rx="1"/>
  <!-- 8. 底层铜箔 -->
  <rect x="70" y="253" width="280" height="10" fill="url(#copper)" rx="1"/>
  <!-- 9. 底层阻焊 -->
  <rect x="70" y="265" width="280" height="8" fill="#2d8a4e" rx="1" opacity="0.7"/>

  <!-- 左侧厚度标注 -->
  <line x1="55" y1="79" x2="55" y2="269" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3"/>
  
  <g font-size="10" fill="#999" text-anchor="end">
    <text x="50" y="90">~30μm</text>
    <text x="50" y="117">~100μm</text>
    <text x="50" y="145">~35μm</text>
    <text x="50" y="180">~400μm</text>
    <text x="50" y="233">~100μm</text>
    <text x="50" y="260">~30μm</text>
  </g>

  <!-- 层名标注（右侧引出线） -->
  <g font-size="11" fill="#555">
    <line x1="355" y1="79" x2="375" y2="79" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="83">阻焊层（防氧化）</text>

    <line x1="355" y1="90" x2="375" y2="90" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="94" fill="#d97706" font-weight="bold">顶层信号走线</text>

    <line x1="355" y1="132" x2="375" y2="132" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="136" fill="#d97706" font-weight="bold">内层电源/接地层</text>

    <line x1="355" y1="174" x2="375" y2="174" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="178">芯板（FR-4 玻璃纤维）</text>

    <line x1="355" y1="216" x2="375" y2="216" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="220" fill="#d97706" font-weight="bold">内层信号层</text>

    <line x1="355" y1="258" x2="375" y2="258" stroke="#aaa" stroke-width="0.5"/>
    <text x="378" y="262" fill="#d97706" font-weight="bold">底层走线</text>
  </g>

  <!-- 省略号标注更多层 -->
  <text x="210" y="185" text-anchor="middle" font-size="16" fill="#aaa">···</text>
  <text x="210" y="199" text-anchor="middle" font-size="10" fill="#aaa">AI 服务器可重复 20+ 层</text>

  <!-- 底部对比箭头 -->
  <g transform="translate(70, 295)">
    <text x="140" y="10" text-anchor="middle" font-size="11" fill="#999">普通服务器总厚 ~1.6mm</text>
    <line x1="30" y1="16" x2="250" y2="16" stroke="#ccc" stroke-width="1"/>
    <polygon points="30,12 30,20" fill="#ccc"/>
    <polygon points="250,12 250,20" fill="#ccc"/>
  </g>

  <!-- 关键说明 -->
  <g transform="translate(70, 330)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#333">为什么 AI 服务器需要更多层？</text>
    <text x="0" y="20" font-size="11" fill="#666">• GPU 与 HBM 之间需要大量高速信号线（>10,000 条），普通 PCB 布不下</text>
    <text x="0" y="36" font-size="11" fill="#666">• 高速信号（PCIe 5.0/6.0）需要严格的阻抗控制，增加层数保证信号质量</text>
    <text x="0" y="52" font-size="11" fill="#666">• 功率更大（>1000W），需要更多电源/接地层散热和稳压</text>
  </g>
</svg>